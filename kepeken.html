<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-size: 26px;
        }
        body {
            background-color: darkslategray;
        }
        button {
            width: 100%;
            display: block;
            background-color: black;
            color: greenyellow;
        }
        textarea {
            width: 100%;
            display: block;
            background-color: black;
            color: greenyellow;
            font-family: monospace;
            min-height: fit-content;
        }
        #output {
            height: 100%;
            background-color: black;
            color: greenyellow;
            font-family: monospace;
            border-style: inset;
            border-width: 2px;
            border-color: white;
            width: 100%;
            text-align: left;
        }
        p {
            margin: 0px;
        }
        .zone {
            width: calc(max(40%, 400px));
            height: 100%;
            margin-right: 5%;
            margin-left: 5%;
            align-content: center;
            text-align: center;
            flex: auto;
        }
        .poki {
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            align-items: center;
            text-align: center;
        }
        .label {
            color: white;
            font-family: monospace;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body onload="init()">
    <button onclick="run()">RUN!</button>
    <div class="poki">
        <div class="zone"><p class="label">Program:</p><textarea name="code" id="code" onkeyup="textAreaAdjust(this)"></textarea></div>
        <div class="zone"><p class="label">Output:</p><div id="output"></div></div>
    </div>
    <script src="interpreter.js"></script>
    <script>
        function init() {
            textAreaAdjust(document.getElementById("code"))
        }

            runCode(document.getElementById("code").value.split("\n"));

            console.log(vars)
        }
        function textAreaAdjust(element) {
            element.style.height = "1px";
            element.style.height = (25+element.scrollHeight)+"px";
        }
    </script>
</body>
</html>
